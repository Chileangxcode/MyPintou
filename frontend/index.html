    <title>MyPintou (Myពិន្ទុ) • ប្រព័ន្ធគ្រប់គ្រងពិន្ទុ និងការវាយតម្លៃសិក្សាឆ្លាតវៃ</title>
    
    <!-- Theme pre-initialization to avoid flash of wrong theme -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('sms_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Preconnect & DNS-Prefetch API Endpoint for Lightning-Fast Initial Requests -->
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://script.googleusercontent.com">

    <!-- Google Fonts: Battambang, Kantumruy Pro, Outfit, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
